<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .joke-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
            font-weight: 500;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .joke-info {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .info-badge {
            background: #f0f0f0;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
        }

        .info-badge span {
            color: #333;
            margin-left: 5px;
        }

        .copy-button {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
            text-decoration: underline;
            transition: color 0.3s;
        }

        .copy-button:hover {
            color: #764ba2;
        }

        .copy-feedback {
            color: #28a745;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .joke-text {
                font-size: 16px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh every time you click!</p>

        <div class="joke-info">
            <div class="info-badge">Type: <span id="jokeType">-</span></div>
            <div class="info-badge">Laughs: <span id="jokeCount">0</span></div>
        </div>

        <div class="joke-container">
            <div class="joke-text" id="jokeDisplay">Click the button to get a joke!</div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="newJokeBtn">Get New Joke</button>
            <button class="btn-secondary" id="copyBtn">Copy Joke</button>
        </div>

        <button class="copy-button" id="copyFeedback">✓ Copied to clipboard!</button>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        let jokesLoaded = 0;
        let currentJoke = '';
        let currentJokeType = '';

        // Fetch joke from JokeAPI
        async function fetchJoke() {
            const jokeDisplay = document.getElementById('jokeDisplay');
            const errorMessage = document.getElementById('errorMessage');
            
            try {
                jokeDisplay.textContent = '🔄 Loading...';
                jokeDisplay.classList.add('loading');
                errorMessage.style.display = 'none';

                const response = await fetch('https://v2.jokeapi.dev/joke/Any?type=single');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                
                if (data.error) {
                    throw new Error('Could not retrieve joke');
                }

                currentJoke = data.joke;
                currentJokeType = data.type || 'Single';
                jokesLoaded++;

                // Update display
                jokeDisplay.textContent = currentJoke;
                jokeDisplay.classList.remove('loading');
                document.getElementById('jokeType').textContent = currentJokeType;
                document.getElementById('jokeCount').textContent = jokesLoaded;

                // Reset copy feedback
                document.getElementById('copyFeedback').style.display = 'none';

            } catch (error) {
                jokeDisplay.textContent = '😔 Oops! Could not load a joke.';
                jokeDisplay.classList.remove('loading');
                errorMessage.textContent = `Error: ${error.message}`;
                errorMessage.style.display = 'block';
            }
        }

        // Copy joke to clipboard
        function copyJoke() {
            if (!currentJoke) {
                alert('Please load a joke first!');
                return;
            }

            navigator.clipboard.writeText(currentJoke).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.display = 'block';
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 2000);
            }).catch(() => {
                alert('Failed to copy joke');
            });
        }

        // Event listeners
        document.getElementById('newJokeBtn').addEventListener('click', fetchJoke);
        document.getElementById('copyBtn').addEventListener('click', copyJoke);

        // Load initial joke
        fetchJoke();
    </script>
</body>
</html>
